name: Build SenPlayer + Profile GIF tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4
        with:
          path: patch-kit

      - name: Checkout exact Beta 17 source
        uses: actions/checkout@v4
        with:
          repository: youngchris29-art/NuvioTV
          ref: tvos-v0.3.0-beta.17
          submodules: false
          fetch-depth: 0
          path: source

      - name: Checkout NuvioMobile submodule
        working-directory: source
        run: |
          set -e

          NUVIO_SHA="$(git ls-tree HEAD NuvioMobile | awk '{print $3}')"

          if [ -z "$NUVIO_SHA" ]; then
            echo "Could not determine NuvioMobile commit"
            exit 1
          fi

          echo "NuvioMobile commit: $NUVIO_SHA"

          rm -rf NuvioMobile

          git clone https://github.com/youngchris29-art/NuvioMobile.git NuvioMobile
          cd NuvioMobile
          git checkout "$NUVIO_SHA"

          echo "NuvioMobile checked out successfully:"
          git rev-parse HEAD

          # The tvOS build does not need the nested Android-only libass
          # submodule, so leave it uninitialized.
          git submodule deinit -f --all || true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Xcode and tvOS SDK
        run: |
          set -e

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Available tvOS SDKs:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Apply SenPlayer + Profile GIF patch
        working-directory: source
        run: |
          set -e

          mkdir -p scripts
          cp ../patch-kit/scripts/apply_patch.py scripts/apply_patch.py

          python3 scripts/apply_patch.py

      - name: Verify patch
        working-directory: source
        run: |
          set -e

          echo "Checking SenPlayer URL scheme..."
          grep -q '<string>senplayer</string>' NuvioMobile/iosApp/NuvioTV/Info.plist

          echo "Checking backgroundUrl model support..."
          grep -R -q 'backgroundUrl' \
            NuvioMobile/shared/src/commonMain/kotlin/com/nuvio/app/features/profiles

          echo "Checking GIF background view..."
          test -f \
            NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionRemoteAnimatedImage.swift

          echo "Checking ProfileSelectionView integration..."
          grep -q 'ProfileSelectionRemoteAnimatedImage' \
            NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionView.swift

          echo
          echo "Patch verification passed."

      - name: Build QuickJS runtime
        working-directory: source
        run: |
          set -e

          if [ -f scaffolding/build-quickjs-tvos.sh ]; then
            bash scaffolding/build-quickjs-tvos.sh
          else
            echo "QuickJS build script not present; continuing."
          fi

      - name: Build tvOS app
        working-directory: source/NuvioMobile/iosApp
        run: |
          set -e

          SDK="$(xcodebuild -showsdks | awk '/appletvos/ {print $NF}' | tail -1)"

          if [ -z "$SDK" ]; then
            echo "No tvOS SDK was found."
            xcodebuild -showsdks
            exit 1
          fi

          echo "Using tvOS SDK: $SDK"

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -sdk "$SDK" \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built app
        id: locate_app
        working-directory: source
        run: |
          set -e

          APP="$(find NuvioMobile/iosApp \
            -type d \
            -name 'NuvioTV.app' \
            -path '*/Release-appletvos/*' \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "Could not locate NuvioTV.app"
            echo
            echo "Available .app bundles:"
            find NuvioMobile/iosApp -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Verify SenPlayer in built app
        working-directory: source
        env:
          APP_PATH: ${{ steps.locate_app.outputs.app_path }}
        run: |
          set -e

          echo "Checking final Info.plist..."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :LSApplicationQueriesSchemes" \
            "$APP_PATH/Info.plist" || true

          if /usr/libexec/PlistBuddy \
            -c "Print :LSApplicationQueriesSchemes" \
            "$APP_PATH/Info.plist" \
            | grep -q "senplayer"; then
            echo "SenPlayer scheme preserved."
          else
            echo "WARNING: SenPlayer scheme was not found in the built plist."
          fi

      - name: Package unsigned IPA
        working-directory: source
        env:
          APP_PATH: ${{ steps.locate_app.outputs.app_path }}
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact/Payload

          cp -R "$APP_PATH" artifact/Payload/NuvioTV.app

          cd artifact

          zip -qry \
            ../NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa \
            Payload

          cd ..

          echo "Created:"
          ls -lh NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-SenPlayer-ProfileGIF-unsigned
          path: source/NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa
          if-no-files-found: error

name: Build SenPlayer + Profile GIF tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout NuvioTV
        uses: actions/checkout@v4
        with:
          repository: youngchris29-art/NuvioTV
          ref: tvos-v0.3.0-beta.17
          submodules: false
          fetch-depth: 0
          path: source

      - name: Checkout NuvioMobile
        working-directory: source
        run: |
          set -e

          SHA="$(git ls-tree HEAD NuvioMobile | awk '{print $3}')"

          echo "Required NuvioMobile SHA: $SHA"

          rm -rf NuvioMobile

          git clone \
            https://github.com/youngchris29-art/NuvioMobile.git \
            NuvioMobile

          cd NuvioMobile
          git checkout "$SHA"

          echo "Checked out:"
          git rev-parse HEAD

          git submodule update --init -- MPVKit

      - name: Build QuickJS tvOS dependency
        working-directory: source
        run: |
          set -e
          chmod +x scaffolding/build-quickjs-tvos.sh
          ./scaffolding/build-quickjs-tvos.sh

      - name: Configure Nuvio backend
        working-directory: source/NuvioMobile
        run: |
          set -e

          cat > local.properties <<EOF
          SUPABASE_URL=https://api.nuvio.tv
          SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          EOF

          echo "Created NuvioMobile/local.properties"

      - name: Show exact source revision
        working-directory: source
        run: |
          set -e
          echo "NuvioTV:"
          git rev-parse HEAD
          echo
          echo "NuvioMobile:"
          git -C NuvioMobile rev-parse HEAD

      - name: Apply Profile GIF + SenPlayer patch
        working-directory: source/NuvioMobile
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/tools/tvos-profile-files.tar.gz"
          test -f "$GITHUB_WORKSPACE/tools/tvos-profile-files.sha256"
          tar -xzf "$GITHUB_WORKSPACE/tools/tvos-profile-files.tar.gz"
          sha256sum -c "$GITHUB_WORKSPACE/tools/tvos-profile-files.sha256"
          echo "Profile GIF + SenPlayer files applied and verified"

      - name: Verify patch
        working-directory: source
        run: |
          set -e

          grep -q "background_url" \
            NuvioMobile/shared/src/commonMain/kotlin/com/nuvio/app/features/profiles/ProfileModels.kt

          grep -q "backgroundUrl" \
            NuvioMobile/shared/src/commonMain/kotlin/com/nuvio/app/features/profiles/ProfileRepository.kt

          grep -q "backgroundUrl" \
            NuvioMobile/iosApp/NuvioTV/Screens/ProfilesViewModel.swift

          grep -q "ProfileSelectionRemoteAnimatedImage" \
            NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionView.swift

          test -f \
            NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionRemoteAnimatedImage.swift

          grep -q "<string>SenPlayer</string>" \
            NuvioMobile/iosApp/NuvioTV/Info.plist

          echo "PATCH VERIFICATION PASSED"

      - name: Show Xcode and tvOS SDK
        run: |
          set -e

          sudo xcode-select \
            --switch \
            /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          echo "Available tvOS SDKs:"
          xcodebuild -showsdks | grep -i tvos

      - name: Build tvOS app
        working-directory: source/NuvioMobile/iosApp
        run: |
          set -e

          SDK="$(xcodebuild -showsdks | awk '/appletvos/ {print $NF}' | tail -1)"

          if [ -z "$SDK" ]; then
            echo "No tvOS SDK found."
            xcodebuild -showsdks
            exit 1
          fi

          echo "Using SDK: $SDK"

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -sdk "$SDK" \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: source
        run: |
          set -e

          echo "Searching Xcode DerivedData for NuvioTV.app..."

          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData"             -type d             -name 'NuvioTV.app'             -path '*/Build/Products/Release-appletvos/*'             | head -1)"

          if [ -z "$APP" ]; then
            echo "NuvioTV.app not found in DerivedData."
            echo
            echo "Available .app bundles:"
            find "$HOME/Library/Developer/Xcode/DerivedData"               -type d               -name '*.app'               -print
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          rm -rf artifact
          mkdir -p artifact/Payload

          cp -R "$APP" artifact/Payload/NuvioTV.app

          cd artifact

          zip -qry             ../NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa             Payload

          echo
          echo "IPA created:"
          ls -lh ../NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-SenPlayer-ProfileGIF-unsigned
          path: source/NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa
          if-no-files-found: error

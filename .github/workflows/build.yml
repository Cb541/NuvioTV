name: Build SenPlayer + Profile GIF tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4
        with:
          path: patch-kit

      - name: Checkout exact Beta 17 source
        uses: actions/checkout@v4
        with:
          repository: youngchris29-art/NuvioTV
          ref: tvos-v0.3.0-beta.17
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Xcode command line tools
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Apply SenPlayer + Profile GIF patch
        working-directory: source
        run: |
          mkdir -p scripts
          cp ../patch-kit/scripts/apply_patch.py scripts/apply_patch.py
          python3 scripts/apply_patch.py

      - name: Verify patch
        working-directory: source
        run: |
          grep -q '<string>senplayer</string>' NuvioMobile/iosApp/NuvioTV/Info.plist
          grep -q 'backgroundUrl' NuvioMobile/shared/src/commonMain/kotlin/com/nuvio/app/features/profiles/ProfileModels.kt
          test -f NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionRemoteAnimatedImage.swift
          grep -q 'ProfileSelectionRemoteAnimatedImage' NuvioMobile/iosApp/NuvioTV/Screens/ProfileSelectionView.swift

      - name: Build tvOS app
        working-directory: source
        run: |
          set -e
          bash scaffolding/build-quickjs-tvos.sh || true

          cd NuvioMobile/iosApp

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -sdk appletvos26.5 \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: source
        run: |
          set -e

          APP="$(find NuvioMobile/iosApp/build \
            -type d \
            -path '*/Build/Products/Release-appletvos/NuvioTV.app' \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "Could not locate NuvioTV.app"
            find NuvioMobile/iosApp/build -maxdepth 8 -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Using app: $APP"

          rm -rf artifact
          mkdir -p artifact/Payload

          cp -R "$APP" artifact/Payload/NuvioTV.app

          /usr/libexec/PlistBuddy \
            -c "Add :LSApplicationQueriesSchemes:2 string senplayer" \
            artifact/Payload/NuvioTV.app/Info.plist || true

          cd artifact
          zip -qry ../NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-SenPlayer-ProfileGIF-unsigned
          path: source/NuvioTV-SenPlayer-ProfileGIF-unsigned.ipa
